<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>웹게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
/* Layout: one letterboxed stage (16:9 landscape / 9:16 portrait) — first-person battlefield painted over an ash-fall Midgard, UI as tarnished iron plates with brass and rune engraving */
:root{
  --ink:#0e1114; --ash:#1a1f25; --slate:#2b323b; --iron:#3b434d;
  --bone:#e7e0d2; --bone-dim:#a9a194; --brass:#b8925a; --brass-hi:#e4c48e;
  --blood:#b0473b; --verdigris:#63a291; --frost:#a6bfd1; --violet:#7d6a98; --ember:#e48a46;
  --f-display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --f-serif:"Nanum Myeongjo","Batang",serif;
  --f-ui:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--bone);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;box-sizing:border-box;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px));}
#box{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #262c33,0 20px 60px rgba(0,0,0,.6);background:var(--ash)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;font-size:16px}
#stage.port{width:900px;height:1600px}
#stage.shake{animation:shake .32s}
@keyframes shake{15%{translate:calc(-9px*var(--sh,1)) calc(4px*var(--sh,1))}35%{translate:calc(8px*var(--sh,1)) calc(-5px*var(--sh,1))}55%{translate:calc(-6px*var(--sh,1)) calc(3px*var(--sh,1))}75%{translate:calc(3px*var(--sh,1)) calc(-1px*var(--sh,1))}}
/* 타격감: 베기 궤적 · 불꽃 · 충격파 · 히트 스톱 */
.slash{position:absolute;left:0;top:0;width:var(--w,380px);height:var(--h,7px);margin:calc(var(--h,7px)/-2) 0 0 calc(var(--w,380px)/-2);border-radius:50%;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff8e6 35%,#fff 50%,#ffd98f 70%,transparent);animation:slash .3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes slash{0%{transform:rotate(var(--a)) scaleX(0);opacity:1}40%{transform:rotate(var(--a)) scaleX(1);opacity:1}100%{transform:rotate(var(--a)) scaleX(1.12) scaleY(.15);opacity:0}}
.spark{position:absolute;left:0;top:0;width:var(--l,12px);height:3px;margin:-1.5px 0 0 0;border-radius:2px;background:var(--c,#ffe2a6);transform-origin:0 50%;transform:rotate(var(--r));animation:spark var(--t,.45s) cubic-bezier(.1,.8,.3,1) forwards;pointer-events:none}
@keyframes spark{to{transform:rotate(var(--r)) translateX(var(--d)) scaleX(.15);opacity:0}}
.shock{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #fff1cc;animation:shock .42s ease-out forwards;pointer-events:none}
@keyframes shock{from{transform:scale(.3);opacity:1}to{transform:scale(var(--rs,4));opacity:0;border-width:1px}}
.flashx{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),#fff6 0,#fff2 18%,transparent 45%);animation:flashx .22s ease-out forwards;pointer-events:none}
@keyframes flashx{to{opacity:0}}
#enemy.hstop #eart{animation:none!important}
#enemy.lunge #eart{animation:lunge2 .3s ease-in}
@keyframes lunge2{45%{transform:translateY(22px) scale(1.09)}}
#ppanel.jolt{animation:jolt .32s}
@keyframes jolt{20%{transform:translate(-8px,4px)}45%{transform:translate(7px,-3px)}70%{transform:translate(-4px,2px)}}
.fnum.t2{font-size:64px;color:#ffe2a8;animation:pop 1.1s ease-out forwards}
.fnum.t3{font-size:92px;color:#ffc94d;-webkit-text-stroke:2px #3b1c04;text-shadow:0 4px 0 #000;animation:pop 1.25s ease-out forwards}
.port .fnum.t2{font-size:76px}.port .fnum.t3{font-size:108px}
@keyframes pop{0%{opacity:0;transform:scale(2.4) rotate(var(--rot,0deg))}10%{opacity:1;transform:scale(.88) rotate(var(--rot,0deg))}20%{transform:scale(1.08) rotate(var(--rot,0deg))}30%{transform:scale(1) rotate(var(--rot,0deg))}100%{opacity:0;transform:translateY(-80px) rotate(var(--rot,0deg))}}
canvas#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
button{font-family:var(--f-ui);color:var(--bone);cursor:pointer}
button:focus-visible{outline:3px solid var(--brass-hi);outline-offset:3px}

/* ---------- top bar ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:56px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 22px;
  background:linear-gradient(#0d1013ee,#0d101300);font-size:16px}
.port #topbar{height:84px;padding:0 24px;font-size:18px}
.tb-l,.tb-r{display:flex;align-items:center;gap:18px;min-width:0}
.logo{font-family:var(--f-display);font-weight:400;font-size:1.35em;color:var(--brass-hi);letter-spacing:.04em;white-space:nowrap}
.port .logo{display:none}
.tb-chip{color:var(--bone-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.tb-chip b{color:var(--bone);font-weight:700}
.xp{display:inline-block;vertical-align:middle;width:64px;height:6px;background:#0007;border-radius:3px;overflow:hidden;margin-left:6px;box-shadow:inset 0 0 0 1px #fff1}
.xp i{display:block;height:100%;background:var(--brass)}
.plate-btn{background:linear-gradient(#3a414a,#22272d);border:1px solid #5d5547;border-radius:6px;padding:6px 14px;font-size:.92em;box-shadow:inset 0 1px 0 #ffffff14}
.plate-btn:hover:not(:disabled){border-color:var(--brass)}
.plate-btn:disabled{opacity:.45;cursor:default}

/* ---------- enemy ---------- */
#scene{position:absolute;inset:0;z-index:1;pointer-events:none}
#enemy{position:absolute;pointer-events:auto;cursor:pointer}
#eart{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite;filter:drop-shadow(0 0 0 transparent);transition:filter .15s}
#eart.still{animation:none}
#eart .bwrap{position:absolute;left:50%;bottom:0;height:102%;aspect-ratio:397/795;translate:-50% 0}
#eart .bwrap img{position:absolute;display:block;object-fit:fill}
#eart .bwrap img.bbody{left:0;top:0;width:100%;height:100%}
#eart .bwrap img.bface{left:36.776%;top:8.050%;width:19.144%;height:8.050%}
#eart svg,#eart img{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.012) translateY(-1px)}}
#enemy.target #eart{filter:drop-shadow(0 0 14px #e4c48eaa) drop-shadow(0 0 2px #e4c48e)}
#enemy.hit #eart{animation:hit .3s}
@keyframes hit{0%{filter:brightness(3) saturate(0)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}100%{filter:none;transform:none}}
#enemy.dead #eart{transition:opacity .8s,transform .8s;opacity:0;transform:translateY(30px) scaleY(.9)}
#eplate{position:absolute;left:50%;top:100%;translate:-50% 10px;width:300px;text-align:center;pointer-events:none}
.land #eplate{top:auto;bottom:100%;translate:-50% -6px;width:340px}
.land #intent{bottom:calc(100% + var(--ph,92px))}
.port #eplate{width:380px}
.ename{font-family:var(--f-display);font-size:24px;text-shadow:0 2px 6px #000}
.ename small{font-family:var(--f-ui);font-size:14px;color:var(--bone-dim);margin-left:6px}
.port .ename{font-size:30px}
.ebar,.pbar{position:relative;height:16px;border-radius:3px;background:#0b0d10;box-shadow:inset 0 0 0 1px #ffffff1a,0 2px 6px #0008;margin-top:6px;overflow:hidden}
.ebar i,.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c45a4c,#7d2a22);transition:width .35s}
.ebar span,.pbar span{position:relative;font-size:12px;font-weight:700;line-height:16px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.ebar b.blk{position:absolute;left:-6px;top:-4px;width:26px;height:24px;display:grid;place-items:center;font-size:12px;background:var(--frost);color:#0d1520;clip-path:polygon(50% 0,100% 18%,92% 70%,50% 100%,8% 70%,0 18%)}
.port .ebar{height:20px}.port .ebar span{line-height:20px;font-size:14px}
.apbar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:7px;font-size:13px;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.apbar .pips{display:flex;gap:3px}.apbar .pips i{width:12px;height:12px;border-radius:2px;transform:rotate(45deg);background:#0c0f12;border:1px solid #b8925a77}
.apbar .pips i.on{background:var(--brass-hi);border-color:var(--brass-hi);box-shadow:0 0 6px #e4c48e88}
.apbar b{color:var(--bone);font-weight:700}.apbar.warn .pips i.on{background:#e0705f;border-color:#e0705f;box-shadow:0 0 8px #e0705faa}.apbar.warn b{color:#f0a493}
.apbar.done{opacity:.6}
.port .apbar{font-size:16px}.port .apbar .pips i{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}
.chip{font-size:12px;padding:2px 7px;border-radius:10px;background:#0c0f12d9;border:1px solid #ffffff22;white-space:nowrap}
.port .chip{font-size:15px}
.chip.bad{border-color:#b0473b88;color:#f0b8ae}.chip.good{border-color:#63a29188;color:#b8e2d6}.chip.brass{border-color:#b8925a99;color:var(--brass-hi)}.chip.trait{border-style:dashed;color:var(--bone-dim)}
#intent{position:absolute;left:50%;bottom:100%;translate:-50% -12px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;white-space:nowrap}
.iv{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:18px;background:#0c0f12e6;border:1px solid #ffffff26;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.port .iv{font-size:28px}
.iv svg{width:22px;height:22px}.port .iv svg{width:28px;height:28px}
.iv em{font-style:normal;font-size:13px;font-weight:500;color:var(--bone-dim)}
.iv.atk{border-color:#b0473b99}.iv.def{border-color:#a6bfd199}.iv.debuff{border-color:#7d6a98aa}.iv.curse{border-color:#7d6a98aa}.iv.mercy{border-color:#fff;box-shadow:0 0 18px #ffffff66}
.iname{font-size:14px;color:var(--bone-dim);text-shadow:0 1px 3px #000}
.port .iname{font-size:17px}
#speech{position:absolute;z-index:2;max-width:520px;padding:14px 18px;border-radius:10px;background:#f1ece2;color:#1a1714;font-family:var(--f-serif);font-size:20px;line-height:1.5;box-shadow:0 10px 30px #000a;pointer-events:none;text-wrap:pretty;transition:opacity .25s}
.port #speech{font-size:22px;max-width:330px}
#speech::after{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:#f1ece2;border-left:0}
.port #speech::after{left:auto;right:-10px;border:10px solid transparent;border-left-color:#f1ece2;border-right:0}

/* ---------- player UI ---------- */
#cui{position:absolute;inset:0;z-index:2;pointer-events:none}
#cui>*{pointer-events:auto}
#ppanel{position:absolute;left:24px;bottom:22px;width:290px;padding:14px 16px;border-radius:10px;background:linear-gradient(#232930f2,#15191df2);border:1px solid #4e483e;box-shadow:0 10px 26px #0009,inset 0 1px 0 #ffffff12;display:flex;flex-direction:column;gap:10px}
.port #ppanel{left:24px;right:24px;bottom:auto;top:808px;width:auto;padding:14px 18px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 18px}
.pp-name{font-family:var(--f-display);font-size:18px;color:var(--brass-hi);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px}
.pp-name small{font-family:var(--f-ui);font-size:13px;color:var(--bone-dim)}
.port .pp-name{font-size:24px;flex:0 0 auto}
.pp-hp{min-width:0}
.port .pp-hp{flex:1 1 220px}
.pbar{height:20px}.pbar span{display:block;text-align:center;line-height:20px;font-size:13px}
.port .pbar{height:26px}.port .pbar span{line-height:26px;font-size:17px}
.pp-row{display:flex;align-items:center;gap:14px}
.orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;line-height:1;
  background:radial-gradient(circle at 40% 35%,#f0c983,#a27237 55%,#5b3d1b);color:#1d140a;box-shadow:0 0 0 3px #2a2118,0 0 0 4px #b8925a77,0 6px 14px #000a;font-variant-numeric:tabular-nums}
.orb small{font-size:15px;opacity:.8}
.orb.blood{background:radial-gradient(circle at 40% 35%,#e0705f,#8a2b22 55%,#3d0f0b);color:#f6ddd6;font-size:20px;font-family:var(--f-ui);font-weight:800}
.port .orb{width:84px;height:84px;font-size:40px}
.shield{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--bone-dim)}
.shield b{display:grid;place-items:center;width:42px;height:46px;font-size:18px;color:#0d1520;background:var(--frost);clip-path:polygon(50% 0,100% 16%,92% 70%,50% 100%,8% 70%,0 16%);font-variant-numeric:tabular-nums}
.shield.zero b{background:#3b434d;color:var(--bone-dim)}
.port .shield{font-size:18px}
#ppanel .chips{justify-content:flex-start;margin:0}
.port #ppanel .chips{flex-basis:100%}
#piles{position:absolute;right:24px;bottom:22px;display:flex;align-items:flex-end;gap:12px}
.port #piles{left:24px;right:24px;bottom:24px;justify-content:space-between}
.pile{width:86px;height:112px;border-radius:9px;border:1px solid #6b604e;background:linear-gradient(#2a3038,#1a1e23);box-shadow:3px -3px 0 -1px #1c2026,3px -3px 0 0 #6b604e88,6px -6px 0 -1px #1c2026,6px -6px 0 0 #6b604e66,9px -9px 0 -1px #1c2026,9px -9px 0 0 #6b604e44,0 8px 18px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--bone-dim)}
.pile b{font-family:var(--f-display);font-size:30px;color:var(--bone);font-weight:400;font-variant-numeric:tabular-nums}
.port .pile{width:104px;height:132px;font-size:15px}.port .pile b{font-size:36px}
.port .pilegrp{display:flex;gap:14px}
#endTurn{width:150px;height:72px;border-radius:10px;border:1px solid #c9a36a;background:linear-gradient(#cfa86a,#8d6a37 60%,#6c4f27);color:#1b1309;font-family:var(--f-display);font-size:26px;box-shadow:0 8px 20px #000a,inset 0 1px 0 #fff5}
#endTurn:disabled{filter:grayscale(.9) brightness(.6);cursor:default}
.port #endTurn{width:210px;height:96px;font-size:34px}

/* ---------- cards ---------- */
#hand{position:absolute;inset:0;z-index:3;pointer-events:none}
.card{position:absolute;left:0;top:0;width:16.8em;height:23.6em;font-size:11.5px;pointer-events:auto;touch-action:none;cursor:grab;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s;will-change:transform}
.port .card{font-size:12.5px}
.card.hover{z-index:70!important}
.card.single .cname span::after{content:" · 1장";color:var(--brass-hi)}
.card.fused .face.front{box-shadow:0 .8em 1.8em #0000008c,inset 0 0 0 .4em #0d0f12,inset 0 0 0 .5em var(--fr2),0 0 1.4em #d7a24a88}
.card.stack .inner::before,.card.stack .inner::after{content:"";position:absolute;inset:0;border-radius:1.2em;border:.2em solid #6b604e;background:#1a1e23;box-shadow:0 .4em 1em #0008;z-index:-1}
.card.stack .inner::before{translate:.55em -.55em}.card.stack .inner::after{translate:1.1em -1.1em;opacity:.7}
.card.stack .inner{isolation:isolate}
.card.dragging{transition:none;cursor:grabbing;z-index:50!important}
.lift{width:100%;height:100%}
.card .lift{transition:transform .16s ease-out}
.card.hover .lift{transform:translateY(-4.4em) scale(1.08)}
.card.dragging .lift{transform:scale(1.04)}
.card.armed .face{box-shadow:0 0 0 3px var(--brass-hi),0 0 28px #e4c48e88}
.card.gone{opacity:0}
.inner{position:relative;width:100%;height:100%}
.turning .inner{animation:turn .3s ease-in-out}
@keyframes turn{50%{transform:scaleX(0)}}
.face{position:absolute;inset:0;border-radius:1.2em;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(120% 80% at 50% 0%,#3b414a 0%,#1d2126 58%,#121418 100%);border:.2em solid var(--fr);
  box-shadow:0 .8em 1.8em #0000008c,inset 0 0 0 .4em #0d0f12,inset 0 0 0 .5em var(--fr2)}
.face.back{display:none}
.flipped .face.front{display:none}
.flipped .face.back{display:flex}
.btext.dense{font-size:1.2em;line-height:1.42;padding:.3em .9em}
.r-start,.r-common{--fr:#7d838b;--fr2:#7d838b55}.r-combo{--fr:#7fae8f;--fr2:#7fae8f66}.r-fusion{--fr:#d7a24a;--fr2:#d7a24a88}.r-uncommon{--fr:#b8925a;--fr2:#b8925a66}.r-rare{--fr:#e2e6ea;--fr2:#e2e6ea66}.r-special{--fr:#a53c32;--fr2:#a53c3277}.r-curse{--fr:#6f5c88;--fr2:#6f5c8866}
.t-atk{--tt:#a5584b}.t-def{--tt:#5b9888}.t-skill{--tt:#bcae92}.t-power{--tt:#b8925a}.t-curse{--tt:#5b4a73}
.cost{position:absolute;left:.6em;top:.6em;width:3.8em;height:3.8em;border-radius:50%;display:grid;place-items:center;z-index:2;font-family:var(--f-display);font-size:1em;
  background:radial-gradient(circle at 38% 32%,#f2cd8a,#9d6d33 60%,#4d3416);color:#1c140a;box-shadow:0 0 0 .2em #16120d,0 .3em .6em #000a}
.cost b{font-size:2.4em;font-weight:400;line-height:1}
.cost.hp{background:radial-gradient(circle at 38% 32%,#e47b6a,#8f2c22 60%,#3e0f0b);color:#fbe2dc}
.cost.hp b{font-family:var(--f-ui);font-weight:800;font-size:1.15em;line-height:1.05;text-align:center}
.cost.none{display:none}
.cost.down{box-shadow:0 0 0 .2em #16120d,0 0 0 .4em var(--verdigris)}
.card.cant .cost{filter:grayscale(.6)}
.card.cant .cost.hp,.card.cant .cost{box-shadow:0 0 0 .2em #16120d,0 0 0 .4em #c44}
.cname{width:100%;box-sizing:border-box;padding:.4em .6em 0 2.75em;height:4.6em;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;font-family:var(--f-display);font-size:1.7em;line-height:1.08;text-shadow:0 .1em .2em #000;word-break:keep-all}
.cname span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cname.long{font-size:1.36em;height:5.75em;padding-left:3.45em}
.art{width:88%;height:6.6em;flex:0 0 auto;margin:.2em 0 .5em;border-radius:.6em;position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tt) 35%,#15181c),#0b0d10 80%);box-shadow:inset 0 0 0 .1em #ffffff1a,inset 0 -1.2em 2em #0008}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctext{width:100%;box-sizing:border-box;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:flex-start;text-align:left;padding:0 1em;font-size:1.34em;line-height:1.38;font-weight:600;color:var(--bone);word-break:keep-all;overflow:hidden}
.ctext.dense{font-size:1.14em;line-height:1.3}
.ctext .modline{color:var(--brass-hi);font-weight:700}
.ctype{flex:0 0 auto;align-self:stretch;padding:0 1.1em;font-size:1.1em;letter-spacing:.12em;color:var(--bone-dim);margin:.1em 0 .9em}
.marks{position:absolute;right:.6em;top:.7em;display:flex;flex-direction:column;gap:.3em;align-items:flex-end;z-index:2}

/* 다인슬레이프 패배: 화면이 빨갛게 물듦 */

.dwrap{width:150px;height:150px}.port .dwrap{width:190px;height:190px}

.dres{display:flex;flex-direction:column;gap:4px;font-family:var(--f-serif);font-size:19px;line-height:1.6}

.port .choice{font-size:21px;padding:18px 22px}.port .choice b{font-size:26px}.port .choice span{font-size:19px}
.btn-main{align-self:center;padding:12px 34px;border-radius:8px;border:1px solid #c9a36a;background:linear-gradient(#cfa86a,#8d6a37 60%,#6c4f27);color:#1b1309;font-family:var(--f-display);font-size:22px;box-shadow:0 8px 20px #0009,inset 0 1px 0 #fff5}

.cardrow{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}

/* title */

  background:linear-gradient(90deg,#16120ecc,#2a221acc 18%,#1f1912cc 50%,#2a221acc 82%,#16120ecc),repeating-linear-gradient(90deg,#00000022 0 3px,transparent 3px 19px,#ffffff08 19px 21px,transparent 21px 37px);
  box-shadow:inset 0 0 40px #000c}

.mnode{cursor:default}

function rollEnemyGear(n){const o=[];for(let i=0;i<n;i++){const g=wpick(LOOT_W),pool=gearOf(g);o.push(pool.length?pick(pool):'@'+g)}return o}

function ensureGear(r){if(!r)return r;if(!r.gear)r.gear={head:[null],body:[null],leg:[null,null],foot:[null,null],arm:[null,null]};if(!r.bag)r.bag=[];return r}
function wornGear(r=S.run){if(!r||!r.gear)return[];const o=[];for(const s of GSLOT_ORDER)for(const k of(r.gear[s]||[]))if(k&&GEAR[k])o.push(k);return o}
function gs(stat){if(!climbOn())return 0;let v=0;for(const k of wornGear())v+=GEAR[k].fx[stat]||0;return v}
function gearHp(r,dv){if(!dv)return;r.maxHp=Math.max(1,r.maxHp+dv);if(dv>0)r.hp+=dv;r.hp=Math.min(r.hp,r.maxHp)}
function wearAt(r,k,s,i){ensureGear(r);const old=r.gear[s][i];if(old)gearHp(r,-(GEAR[old].fx.hp||0));r.gear[s][i]=k;gearHp(r,GEAR[k].fx.hp||0);return old}
function takeOff(r,s,i){const old=r.gear[s][i];if(!old)return null;r.gear[s][i]=null;gearHp(r,-(GEAR[old].fx.hp||0));return old}
const sellPrice=k=>Math.floor(GEAR[k].p*.6);

function gearTotals(){const keys=['atk','def','acc','eva','hp','flat','block0','blockFirst','blockTurn','blockPct','healPct','restPct','goldPct','cost1'];
  const N={atk:'공격레벨',def:'방어레벨',acc:'명중',eva:'회피',hp:'최대 체력',flat:'고정 추가 피해',block0:'전투 시작 시 방어도',blockFirst:'전투 첫 턴 방어도',blockTurn:'매 턴 시작 시 방어도',blockPct:'방어도 획득량',healPct:'회복 효과',restPct:'휴식 회복량',goldPct:'전투 승리 시 실링',cost1:'전투 첫 턴 코스트'};
  const pc=new Set(['blockPct','healPct','restPct','goldPct']);
  return keys.map(k=>{let v=0;for(const g of wornGear())v+=GEAR[g].fx[k]||0;return v?`${N[k]} ${v>0?'+':''}${v}${pc.has(k)?'%':''}`:''}).filter(Boolean)}
/* 새 장비를 얻을 때 — 빈 칸이 있으면 바로 착용, 칸이 찼으면 교체(벗은 장비는 보관) · 기존 장비를 60%로 팔고 착용 · 새 장비를 보관 */
function gainGear(k,done){
  const r=ensureGear(S.run),e=GEAR[k];if(!e)return done&&done();
  const slots=r.gear[e.s],free=slots.indexOf(null);
  if(free>=0){wearAt(r,k,e.s,free);toast('장비',`「${e.n}」 착용 · ${GSLOT[e.s].n}`);save();renderTop();return done&&done()}
  const m=$('#modal');m.hidden=false;S.modalLock=true;
  m.innerHTML=`<div class="panel" style="width:min(980px,100%)"><div><div class="psub">${GSLOT[e.s].n} 칸이 찼다</div><div class="ptitle">새 장비 · ${e.n}</div></div>
    <div class="eqgrid">${gearCardHTML(k,'','새 장비')}${slots.map(o=>gearCardHTML(o,'','착용 중')).join('')}</div>
    <div class="choices">${slots.map((o,i)=>`<button class="choice" data-sw="${i}"><b>「${GEAR[o].n}」 대신 착용</b><span>벗은 장비는 보관함으로 간다</span></button>
      <button class="choice" data-sell="${i}"><b>「${GEAR[o].n}」 팔고 착용</b><span>본래 가격의 60% · +${sellPrice(o)}실링</span></button>`).join('')}
      <button class="choice" data-keep="1"><b>보관함에 넣는다</b><span>지금 장비는 그대로 둔다</span></button></div></div>`;
  const fin=()=>{closeModal();save();renderTop();done&&done()};
  m.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const old=wearAt(r,k,e.s,+b.dataset.sw);if(old)r.bag.push(old);toast('장비',`「${e.n}」 착용`);fin()});
  m.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const old=wearAt(r,k,e.s,+b.dataset.sell);if(old)r.gold+=sellPrice(old);toast('장비',`「${GEAR[old].n}」 판매 +${sellPrice(old)}실링 · 「${e.n}」 착용`);fin()});
  m.querySelector('[data-keep]').onclick=()=>{r.bag.push(k);toast('장비',`「${e.n}」 보관`);fin()};
}

function dainP3(kind,loss){
  const C=S.C,E=C&&C.E;if(!E||!E.boss||E.phase!==3||S.run.mode!=='dain'||!C.curSpecial)return;

  E.dhits=(E.dhits||0)+1;

}

function knightCheck(){
  const E=S.C&&S.C.E;if(!E||!E.knightMax)return;
  E.knight=Math.min(E.knight,E.block);
  if(E.knight<=0){E.knightMax=0;say(BOSS_LINES.knightDead);clog('은빛 기사가 쓰러졌다','e');return}

}

/* ================= combat math (웹게임 문서: 전투 스탯 · 최종 데미지) ================= */
const hitChance=(acc,eva)=>clamp(Math.round(acc-(eva-50)),5,100);
/* 최종 데미지 = (카드 데미지 + 고정 추가 피해) × (1 + 0.04 × 공격레벨 + 특성 합) × (1 − 0.004 × 상대 방어레벨), 감소 최대 80% */
function formula(die,flat,atk,traits,def,o={}){
  const ts=traits.reduce((s,x)=>s+x.v,0);
  const mult=Math.max(0,1+.04*atk+ts),red=o.ignoreDef?0:Math.min(.8,.004*Math.max(0,def));
  const raw=(die+flat)*mult*(1-red)*(o.x||1),fin=Math.max(0,Math.round(raw));
  const tt=traits.map(x=>`${x.v<0?' − ':' + '}${+Math.abs(x.v).toFixed(2)} ${x.n}`).join('');
  const text=`(${die} + ${flat}) × (1 + 0.04×${atk}${tt}) × (1 − ${o.ignoreDef?'0 [방어 관통]':`0.004×${def}${red>=.8?' [상한 80%]':''}`})${o.x&&o.x!==1?` × ${o.x}`:''} = ${+raw.toFixed(2)} → ${fin}`;
  return{fin,raw,text};
}
const pt=k=>!!(S.run&&S.run.traits&&S.run.traits.includes(k));
const berserk=()=>S.run.mode==='dain'&&S.run.hp<=S.run.maxHp*.25;
const pAtk=()=>S.run.atk+gs('atk'),pDef=()=>S.run.def+gs('def');
const pAcc=()=>S.run.acc+(pt('accUp')?10:0)-(pt('accDown')?10:0)+gs('acc');
const pEva=()=>S.run.eva+(pt('evaUp')?10:0)-(pt('evaDown')?10:0)+gs('eva')+(S.C&&S.screen==='combat'?S.C.evaB+(S.C.evaMod||0):0);
function rollDie(d,player){
  let a=d.a,b=d.b;
  if(player&&d.t==='atk'){if(pt('dieMin'))a=Math.min(b,a+1);if(pt('dieMax'))b+=2}
  let v=ri(a,b);if(player&&d.t==='atk'&&pt('badRoll'))v=Math.min(v,ri(a,b));
  if(S.C&&S.C.spinNow&&S.C.phase==='player'&&v<(a+b)/2){const v2=ri(a,b);clog(`운명의 실패: 주사위 ${v} → ${v2} (다시 굴림)`);v=v2}
  return v;
}
function pDieRange(d){let a=d.a,b=d.b;if(d.t==='atk'){if(pt('dieMin'))a=Math.min(b,a+1);if(pt('dieMax'))b+=2}return[a,b]}
const atkScale=()=>(pt('atkUp')?1.2:1)*(pt('atkDown')?.8:1);
function pTraits(o={}){
  const C=S.C,E=C.E,t=[];
  if(C.pWeak>0)t.push({n:'약화',v:-.25});
  if(E.vuln>0&&!(E.boss&&E.phase===3))t.push({n:'취약',v:.5});
  if(berserk())t.push({n:'광전사-강화',v:.5});
  if(C.yu)t.push({n:'유희',v:+(.2*C.yu).toFixed(2)});
  if(pt('smite'))t.push({n:'강타',v:.25});
  if(pt('dmgDown'))t.push({n:'피해 감소',v:-.2});
  if(pt('pacifist'))t.push({n:'평화주의자',v:-.5});
  if(o.giant)t.push({n:'거인 베기',v:.5});
  return t;
}
function eTraits(){
  const C=S.C,E=C.E,t=[];
  if(E.weak>0&&!(E.boss&&E.phase===3))t.push({n:'약화',v:-.25});
  if(C.pVuln>0)t.push({n:'취약',v:.5});
  if(has(E,'용기')&&E.hp<=E.maxHp*.5)t.push({n:'용기',v:.2});
  if(has(E,'광기'))t.push({n:'광기',v:.2});
  if(has(E,'빈털터리'))t.push({n:'빈털터리',v:.1});
  return t;
}
function enemyAcc(){const E=S.C.E;if(E.boss&&E.phase===3)return 100;return E.acc-(E.boss?E.human*5:0)-(E.frost?20:0)}
/* 예상 피해 범위 (카드·의도 표시용) */
function pPreview(c,d){
  const C=S.C,E=C.E,r=S.run,o=cardStrikeOpts(c);
  const[a,b]=pDieRange(d),sc=atkScale()*(o.scale||1);
  const lo=formula(Math.round(a*sc),o.flat,o.atk,pTraits(o),E.def,{ignoreDef:pt('pierceDef'),x:o.x}).fin;
  const hi=formula(Math.round(b*sc),o.flat,o.atk,pTraits(o),E.def,{ignoreDef:pt('pierceDef'),x:o.x}).fin;
  return{lo,hi,ch:hitChance(pAcc(),E.eva+E.evaB)};
}
function ePreview(d){
  const C=S.C,E=C.E,r=S.run,x=has(E,'무모함')&&E.firstAtk?2:1;
  return{lo:formula(d.a,E.revenge,E.atk,eTraits(),pDef(),{x}).fin,hi:formula(d.b,E.revenge,E.atk,eTraits(),pDef(),{x}).fin,ch:hitChance(enemyAcc(),pEva())};
}
function applyEnemyStatus(k,n){
  const E=S.C.E;

/* 계산 로그 */
function clog(t,cls){const C=S.C;if(!C||!C.log)return;C.log.push([cls||'',t]);if(C.log.length>400)C.log.shift()}

/* ================= player turn ================= */
async function startPlayerTurn(){
  const C=S.C,r=S.run;if(C.over)return;
  C.E.ap=C.E.apMax+(C.turn===0&&eq('bind')?2:0);C.E.early=false;C.tossTurn=0;
  C.turn++;C.phase='player';C.block=C.hold?Math.floor(C.block/2):0;C.hold=false;C.recoil=0;C.discount=false;C.evaB=0;C.hitsTurn=0;
  /* 코스트·드로우 증가는 전투 안에서만 — 전투가 끝나면 기본값으로 */
  r.turns=(r.turns||0)+1;const gr=growth(C.turn);C.maxE=gr.e;C.drawN=gr.d;
  clog(`${C.turn}턴 · 코스트 ${C.maxE} · 드로우 ${C.drawN}`,'h');
  if(r.mode==='dain'){const loss=Math.floor(r.hp*.1);if(loss>0){r.hp-=loss;fxAt('player',`허기 -${loss}`,'self');clog(`허기: 체력 10% 소모 -${loss}`)}}
  if(C.yu){C.yuT++;if(C.yuT>=2){C.yuT=0;C.yu--}}
  for(let i=0;i<C.barrier;i++)gainBlock(rollDie(D(8,12)),0,'결계의 기억 방어 주사위');
  {const gb=gs('blockTurn')+(C.turn===1?gs('block0')+gs('blockFirst'):0);if(gb>0){C.block+=gb;clog(`장비 방어도 +${gb} (현재 ${C.block})`);fxAt('player',`+${gb} 방어도`,'block')}}
  C.energy=Math.max(0,C.maxE+C.nextEnergy+(C.costMod||0)+(C.turn===1?(C.cost1||0)+gs('cost1'):0));C.nextEnergy=0;
  if(C.flaskDebt){const p=Math.min(C.energy,C.flaskDebt);C.energy-=p;clog(`미미르의 물병: 코스트 ${C.flaskDebt} 지불${p<C.flaskDebt?` (남은 코스트가 모자라 ${p}만 지불)`:''}`);C.flaskDebt=0}
  if(C.flaskHp){r.hp=Math.max(1,r.hp-C.flaskHp);fxAt('player',`물병 -${C.flaskHp}`,'self');clog(`미미르의 물병: 체력 ${C.flaskHp} 지불`);C.flaskHp=0}
  if(C.steinBlock){gainBlock(C.steinBlock,0,'스타인러 공방');C.steinBlock=0}
  drawTurn();
  if(pt('penDraw')&&C.turn>1&&C.hand.length){const c=pick(C.hand);C.hand.splice(C.hand.indexOf(c),1);C.disc.push(c);toast('패널티 드로우',`「${CARDS[c.id].name}」을(를) 버렸다`)}
  renderCombat();tutShow();
  if(r.hp<=0)return gameOver();
  if(C.pend.length){await wait(350);await resolvePending();}
  renderCombat();
}
/* 다인 패시브 '저주': 모든 종류의 저주 카드를 사용 가능한 0코스트 체력 회복 50 카드로 변환 */
const dainCurse=()=>!!(S.run&&S.run.mode==='dain'&&!S.screen.startsWith('hunt'));
function lonelyInHand(){if(dainCurse())return 0;return S.C.hand.filter(c=>c.id==='lonely').length}
/* 패 최대 12장 — 넘으면 플레이어가 골라서 버림 (settleHand) */
function drawOne(){
  const C=S.C;
  if(!C.draw.length){if(!C.disc.length)return null;C.draw=shuffle(C.disc);C.disc=[];}
  const c=C.draw.pop();C.hand.push(c);return c;
}
function drawTurn(){const C=S.C;let got=0,guard=0;while(got<(C.drawN||5)-lonelyInHand()&&guard++<40){if(!drawOne())break;got++}}
function drawN(n){n=Math.max(0,n-lonelyInHand());for(let i=0;i<n;i++)drawOne()}
function settleHand(){const C=S.C;if(!C||C.over||C.phase!=='player')return;if(!C.select&&C.hand.length>MAX_HAND)C.select={type:'discard'}}
async function resolvePending(){
  const C=S.C,E=C.E,pend=C.pend;C.pend=[];

    if(p==='discard'&&C.hand.length){const c=pick(C.hand);C.hand.splice(C.hand.indexOf(c),1);C.disc.push(c);toast('고해 강요',`「${CARDS[c.id].name}」을(를) 버렸다`)}
    if(p==='burn'&&C.hand.length){const cur=C.hand.filter(c=>CARDS[c.id].type==='curse');const c=cur.length?pick(cur):pick(C.hand);C.hand.splice(C.hand.indexOf(c),1);C.exh.push(c);if(hasM(c,'ash'))C.ashBonus+=10;toast('백색의 불꽃',`「${CARDS[c.id].name}」이(가) 타 버렸다`)}
    if(p==='steal'){
      const pool=C.hand.filter(c=>!CARDS[c.id].unplayable);
      if(pool.length){const cost=c=>CARDS[c.id].cost??Math.round((CARDS[c.id].hpCost||0)/5);
        pool.sort((a,b)=>cost(b)-cost(a));const c=pool[0];C.hand.splice(C.hand.indexOf(c),1);C.stolen=(C.stolen||[]);C.stolen.push(c);
        toast('검날 떼어내기',`「${CARDS[c.id].name}」을(를) 빼앗아 휘둘렀다`);renderCombat();await wait(300);await enemyUseCard(c.id);}
    }

    if(S.run.hp<=0)return gameOver();

}
async function enemyUseCard(id){

    else if(x.t==='eva'){const v=rollDie(x);E.evaB+=v;clog(`${E.name} 회피 주사위 ${v} → 회피 +${v}`,'e')}

/* card cost */
function costOf(c){
  if(S.screen==='hunt')return hCost(c);
  const d=CARDS[c.id],C=S.C,r=S.run;
  if(d.unplayable&&!dainCurse())return{none:true};
  if(d.unplayable)return{hp:0,pct:0};
  const lt=hasM(c,'light')?1:0,up=pt('costUp')?1:0;
  if(r.mode==='dain'){
    let pct=d.hpCost!=null?d.hpCost:(d.cost||0)*TUNE.humanHpCostPerCost;
    pct=Math.max(0,pct-lt*TUNE.humanHpCostPerCost)+up*TUNE.humanHpCostPerCost;
    if(C&&C.discount)pct=Math.max(0,pct-TUNE.humanHpCostPerCost);
    if(r.hp<=r.maxHp*.05&&pct>0)pct=1;
    return{hp:Math.ceil(r.maxHp*pct/100),pct,down:C&&C.discount};
  }
  let e=Math.max(0,(d.cost||0)-lt)+up;if(C&&C.discount)e=Math.max(0,e-1);
  return{e,down:(C&&C.discount&&d.cost>0)||lt>0};
}
function canPlay(c){
  if(S.screen==='hunt')return hCanPlay(c);

  if(d.unplayable&&!dainCurse())return'사용할 수 없는 카드입니다';
  if(C.seal[c.uid]>0)return'봉인된 카드입니다';
  if(c.id==='d_crumble'&&r.hp>r.maxHp*.25)return'체력이 25% 이하일 때만 사용할 수 있습니다';
  const k=costOf(c);
  if(k.hp!=null){const brand=C.brand.includes(c.uid)?3:0;if(r.hp<=k.hp+brand)return'체력이 부족합니다';}
  else if(k.e>C.energy&&!C.flaskArm)return'코스트가 부족합니다';
  return null;
}
function removeHandEl(uid){const el=stackOf(uid);if(!el)return;el._uids=el._uids.filter(x=>x!==uid);if(!el._uids.length){el.classList.add('gone');setTimeout(()=>el.remove(),220);for(const[k,v]of handEls)if(v===el)handEls.delete(k)}}
/* 카드 한 장의 공격 주사위에 공통으로 붙는 값 */
function cardStrikeOpts(c){

    +(c.id==='d_cannibal'?Math.floor(Math.max(0,E.hp)*.1):0)+(c.id==='d_hungry'?C.eat*5:0)+(d.type==='atk'?gs('flat'):0);
  return{flat,atk:pAtk(),pierce:M('pierce')||!!d.pierce,leech:M('leech'),x:(c.id==='hook'&&C.block>0)?2:1,giant:c.id==='d_giant'&&E.hp>r.hp,scale:M('multi')?.6:1};
}
/* 카드 사용 중 오류가 나도 조작이 멈추지 않게 (S.busy가 남아 드로우·턴 종료가 막히는 것 방지) */
async function playCard(uid){try{return await playCardRaw(uid)}catch(e){console.error(e);clog('오류: '+e.message,'e');toast('오류',e.message)}finally{S.busy=false;if(S.C&&!S.C.over)renderCombat()}}

/* 카드 1장 사용 → 적 행동 수치 -1. 0이 되면 턴 종료와 관계없이 곧바로 행동하고, 그 뒤 턴 종료까지는 행동하지 않음 */

/* 공격 주사위 하나: 굴림 → 명중 판정 → 최종 데미지 공식 → 방어도 */

  await hitStop(tier);hitEnemyAnim(false);C.hitsTurn++;
  if(loss>0&&has(E,'복수심'))E.revenge=Math.min(10,E.revenge+2);
  if(o.leech&&loss>0)heal(loss*.2);
  if(pt('leech')&&loss>0)heal(loss*.1);
  if(r.mode==='dain'&&f.fin>0)heal(f.fin*.25);

  if(pt('burnOn')){E.burn=Math.min(100,E.burn+5)}

function gainBlock(v,add,label){
  const C=S.C;let b=v;if(pt('defUp'))b=Math.round(b*1.25);if(pt('defDown'))b=Math.round(b*.75);if(gs('blockPct'))b=Math.round(b*(1+gs('blockPct')/100));b+=add||0;

  C.block+=b;clog(`${label} ${v}${b!==v?` → ${b}`:''}${debt} · 방어도 +${b} (현재 ${C.block})`);
  if(b>0)fxAt('player',`+${b} 방어도`,'block');renderCombat();return b;
}
/* 고정 피해: 공식·명중을 건너뛰지만 방어도에 막힘 / 트루 데미지: 방어도도 무시 */

  fxAt('enemy',`${label} ${l}`,'info');if(l>0){const o=L[S.orient];sparks(o.ex,o.efeet-o.eh*.55,8);sfx('hit',.7)}hitEnemyAnim(false);renderCombat();checkEnemy();

function heal(n){

/* 적의 공격 주사위 하나 — 같은 최종 데미지 공식과 명중 판정 */

  if(roll>ch){fxAt('player','빗나감','miss');sfx('miss');clog(`${o.mercy?'안 아프게 빨리':`공격 주사위 ${v}`} · 적중률 ${ch}% · 판정 ${roll} → 빗나감`,'miss e');await wait(240);return false}
  let dmg,txt;

  else{const f=formula(v,E.revenge,E.atk,eTraits(),pDef(),{x:has(E,'무모함')&&E.firstAtk?2:1});dmg=f.fin;txt=`공격 주사위 ${v}: ${f.text}`}

  const b=Math.min(C.block,dmg);C.block-=b;const loss=dmg-b;r.hp-=loss;
  clog(`${txt} · 적중률 ${ch}% · 판정 ${roll} → 적중${b?` · 방어도 ${b} 흡수`:''} · 피해 ${loss}`,'e');
  if(loss>0){const big=loss>=Math.max(20,r.maxHp*.12);fxAt('player',`-${loss}`,'self'+(big?' t2':''));flashHurt(big)}else{fxAt('player',`막음 ${b}`,'block');sfx('block')}
  if(loss>0&&has(E,'굶주림')){const h=Math.min(3,E.maxHp-E.hp);if(h>0){E.hp+=h;fxAt('enemy',`+${h}`,'heal')}}
  renderCombat();
  if(r.hp<=0){r.hp=0;await wait(400);gameOver();return loss}
  if(C.recoil>0&&!C.over)fixedDmg(C.recoil,'반동');
  if(loss>0&&eq('dome')&&!C.over){r.dome=(r.dome||0)+loss;if(r.dome>=30){const n=r.dome;r.dome=0;clog(`열돔 주머니: 저장한 피해 ${n} 방출`);fixedDmg(n,'열돔 주머니')}}
  await wait(260);return loss;
}
function chooseIntent(){
  const C=S.C,E=C.E,d=ENEMY[E.key];
  if(E.boss)return bossIntent();
  if(d.order){
    let ord=d.order.slice();
    if(E.key==='priest'&&S.run&&S.run.flags&&S.run.flags.noTithe)ord=ord.filter(a=>a!=='공양 요구');
    if(has(E,'무모함'))ord=ord.filter(a=>ACT[a].k!=='def');
    if(E.turn===0&&has(E,'침착함')){const df=ord.find(a=>ACT[a].k==='def');if(df){E.intent=df;E.idx=ord.indexOf(df);return}}
    E.intent=ord[((E.idx%ord.length)+ord.length)%ord.length];return}
  let pool={...d.acts};
  if(E.key==='priest'&&S.run&&S.run.flags&&S.run.flags.noTithe)delete pool['공양 요구'];
  if(has(E,'무모함'))for(const k in pool)if(ACT[k].k==='def')delete pool[k];
  if(E.turn===0&&has(E,'침착함')){const df=Object.keys(d.acts).find(k=>ACT[k].k==='def');if(df){E.intent=df;return}}
  if(E.last.length===2&&E.last[0]===E.last[1]&&Object.keys(pool).length>1)delete pool[E.last[0]];
  E.intent=wpick(pool);
}

function winCombat(res){
  const C=S.C,E=C.E,r=S.run;if(C.over)return;C.over=true;C.phase='over';
  S.busy=false;
  const lines=[];r.next=null;
  $('#enemy').classList.add('dead');
  if(C.select){C.select=null;$('#prompt').hidden=true}
  if(!res.fled){
    r.kills++;
    if(r.mode==='dain'){
      /* 섭취: 체력·공방렙 1/3 (공방렙 최대 175, 체력 최대 +650). 초과된 회복량은 공방렙으로 — 환산 비율은 임시(10당 1) */
      const want=Math.round(E.maxHp/3),room=Math.max(0,650-(r.eatHp||0)),h=Math.min(want,room),over=want-h;
      const a=Math.round(E.atk/3)+Math.floor(over/10),d=Math.round(E.def/3)+Math.floor(over/10);
      const na=Math.min(175,r.atk+a),nd=Math.min(175,r.def+d);r.eatHp=(r.eatHp||0)+h;
      lines.push(['섭취',`최대 체력 +${h}${over?` (상한 · 초과 ${over})`:''}, 공격레벨 +${na-r.atk}, 방어레벨 +${nd-r.def}`]);r.maxHp+=h;r.hp+=h;r.atk=na;r.def=nd;}
    if(pt('killHeal')){const h=Math.min(r.maxHp-r.hp,Math.round(r.maxHp*.05));if(h>0){r.hp+=h;lines.push(['처치 보상',`체력 +${h}`])}}
    if(has(E,'결핍')){addToDeck('lack');lines.push(['결핍','덱에 결핍 1장 추가'])}
  }
  if(eq('w_remi')&&r.hp>0){const h=Math.min(3,r.maxHp-r.hp);if(h>0){r.hp+=h;lines.push(['레미 공방',`체력 +${h}`])}}
  /* 전투 보상: 일반 100~300 · 정예 500~1500 · 보스 3000 실링 */
  let gold=0;
  if(!res.fled&&!has(E,'빈털터리')){gold=E.boss?TUNE.gold.boss:ri(...TUNE.gold[E.tier==='elite'?'elite':'normal']);if(has(E,'부유함'))gold=Math.round(gold*1.5);const gp=gs('goldPct');if(gp)gold=Math.round(gold*(1+gp/100))}
  if(res.fled)lines.unshift(['점조직','도망쳤다 — 보상 실링 없음 · 장비 탈취 없음']);
  r.gold+=gold;
  if(!res.fled)gainExp(expFor(E.lv,r.lvl),lines);
  /* 장비 탈취 — 상대가 가진 장비 중 1개, 영웅 등급 이상이면 장비 대신 공격레벨·방어레벨 */
  let loot=null;
  if(!res.fled&&E.gear&&E.gear.length){const k=pick(E.gear);
    if(k[0]==='@'){const g=k.slice(1),v=LOOT_STAT[g]||20;r.atk+=v;r.def+=v;lines.push(['장비 탈취',`${GRADE[g]} 등급 — 장비 대신 공격레벨 +${v}, 방어레벨 +${v}`])}
    else loot=k}
  setTimeout(()=>{
    hideCombatUI();
    if(E.boss){r.map.bossDone=true;clearSave();return showVictory(gold,lines,loot)}
    r.at={kind:'reward',gold,lines,loot};save();
    showReward(gold,lines,loot);
  },REDUCED?100:900);
}

function openEquip(){

  const keys=[...(r.equip||[])];if(C&&C.tempEq&&!keys.includes(C.tempEq))keys.push(C.tempEq);

    if(k==='flask')return u.flask?'<span class="eqst">이번 전투에 사용함</span>':`<button class="plate-btn" data-eq="flask" ${live?'':'disabled'}>사용 — 다음 카드 무료</button>`;

    return''};
  const st=k=>{if(!C)return k==='dome'?`<span class="eqst">저장한 피해 ${r.dome||0} / 30</span>`:'';
    const on=(k==='spindle'&&C.spinArm)||(k==='flask'&&C.flaskArm);return(on?'<span class="eqst">준비됨</span>':'')+(k===C.tempEq?'<span class="eqst">크리밀라 공방 — 이번 전투만</span>':'')};

    +`<div class="gslot empty weapon"><span class="eqtag">무기</span><i>무기 칸 · 한손·양손 무기는 추후</i></div>`;

    <div class="eqgrid">${r.bag.length?r.bag.map((k,j)=>gearCardHTML(k,lock?'':`<div class="eqact"><button class="plate-btn" data-wear="${j}">착용</button></div>`)).join(''):'<div class="hint">보관한 장비가 없다</div>'}</div>
    ${keys.length?`<div class="ap-h">특수 장비 (V15에서 얻은 장비)</div><div class="eqgrid">${keys.map(k=>eqCardHTML(k,`<div class="eqact">${st(k)}${act(k)}</div>`)).join('')}</div>`:''}</div>`;

  });

/* ================= 운 주사위 판정 (웹게임 문서: 이벤트 판정) =================
   이벤트용 판정은 운 주사위(정36면체)로 함. P: 명중률, S: 이벤트에 따라 공격레벨 또는 방어레벨
   목표값 T = 36 - P/5 + 난이도 보정 · 최소값 M = 1 + (S ÷ 10, 소수점 버림), 최대 18
   주사위는 M~36 사이에서 나오고, T 이상이면 성공 · T가 M 이하면 굴리지 않고 무조건 통과 (궁니르는 무조건 통과)
   난이도 보정: 쉬움 -6, 보통 0, 어려움 +6 */
const DIFF={easy:{n:'쉬움',v:-6},normal:{n:'보통',v:0},hard:{n:'어려움',v:6}};
const LSTAT={atk:'공격레벨',def:'방어레벨',acc:null};
function luck(chk){
  const r=S.run,P=pAcc(),Sv=chk.s==='atk'?pAtk():chk.s==='def'?pDef():0;
  const T=36-P/5+DIFF[chk.d].v,M=Math.min(18,1+Math.floor(Sv/10))+(eq('w_ash')?2:0),need=Math.ceil(T);
  const auto=T<=M,pct=auto?100:need>36?0:Math.round((36-Math.max(need,M)+1)/(36-M+1)*100);
  return{P,Sv,T,M,need,auto,pct};
}
const chkLabel=(chk,L)=>`판정 · 명중률 ${L.P}%${LSTAT[chk.s]?` + ${LSTAT[chk.s]} ${L.Sv}`:' 단독'} · ${DIFF[chk.d].n} · ${L.auto?'무조건 통과':`성공 ${L.pct}%`}`;
function d36SVG(n,state){
  return`<svg class="d36 ${state||''}" viewBox="0 0 120 120" aria-hidden="true"><polygon class="d36o" points="60,4 108,32 108,88 60,116 12,88 12,32"/>
    <polygon class="d36i" points="60,22 92,41 92,79 60,98 28,79 28,41"/><path class="d36l" d="M60,4V22M108,32L92,41M108,88L92,79M60,116V98M12,88L28,79M12,32L28,41"/>

}

const curPlace=()=>'midgard';/* 지금은 1막 미드가르드만 있음 */
function pickEvent(){const r=S.run,all=Object.keys(GEV).filter(k=>GEV[k].place===curPlace());let left=all.filter(k=>!r.flags.events.includes(k));if(!left.length)left=all;return pick(left)}
const myth=()=>S.run.mode!=='human';
function hpFloor(){const r=S.run;return r.mode==='dain'?Math.ceil(r.maxHp*.01):1}
/* 이벤트 결과 적용 — 순서대로, 화면이 필요한 것(강화·제거·전투)은 끝나면 다음으로 */
function runFx(list,done,notes=[]){
  const r=S.run;if(!list.length){if(notes.length)toast('사건',notes.join(' · '));return done()}
  const[op,a,b]=list[0],next=()=>runFx(list.slice(1),done,notes);
  const deckFixed=()=>{if(!notes.includes('신화덱은 고정되어 있어 카드가 바뀌지 않는다'))notes.push('신화덱은 고정되어 있어 카드가 바뀌지 않는다')};
  switch(op){
    case'gold':r.gold=Math.max(0,r.gold+a);return next();
    case'card':if(myth()){deckFixed();return next()}for(let i=0;i<(b||1);i++)addToDeck(a);return next();
    case'curse':for(let i=0;i<(b||1);i++)addToDeck(a);return next();
    case'hp':r.hp=Math.max(hpFloor(),Math.min(r.maxHp,r.hp+a));return next();
    case'hpPct':r.hp=Math.max(hpFloor(),Math.min(r.maxHp,r.hp+Math.round(r.maxHp*a/100)));return next();
    case'maxHp':r.maxHp=Math.max(1,r.maxHp+a);r.hp=clamp(r.hp,hpFloor(),r.maxHp);return next();
    case'removeId':{if(myth()){deckFixed();return next()}const c=r.deck.find(x=>x.id===a);if(c){r.deck.splice(r.deck.indexOf(c),1);notes.push(`「${CARDS[a].name}」 제거`)}else notes.push(`덱에 ${CARDS[a].name}이(가) 없다`);return next()}
    case'gear':{const k=pick(gearOf(a));notes.push(`장비 「${GEAR[k].n}」 (${GRADE[a]})`);return gainGear(k,next)}
    case'mimirCost':{if(r.mode==='human'){const k=1+a/100;r.base1=r.base1*k;r.maxHp=Math.max(1,Math.round(r.maxHp*k))}else r.maxHp=Math.max(1,r.maxHp+b);r.hp=clamp(r.hp,hpFloor(),r.maxHp);return next()}
    case'removeCurse':{const cs=r.deck.filter(c=>CARDS[c.id].type==='curse');if(!cs.length){notes.push('제거할 저주가 없다');return next()}
      for(let i=0;i<a&&cs.length;i++){const c=cs.splice(Math.floor(rnd()*cs.length),1)[0];r.deck.splice(r.deck.indexOf(c),1);notes.push(`「${CARDS[c.id].name}」 제거`)}return next()}
    case'upgrade':{if(myth()){deckFixed();return next()}const ok=r.deck.filter(c=>modChoices(c).length&&(c.mods||[]).length<2);if(!ok.length){notes.push('강화할 카드가 없다');return next()}
      const left=a-1;return showUpgrade(()=>{save();left>0?runFx([['upgrade',left],...list.slice(1)],done,notes):next()},next,a>1?`강화할 카드를 고른다 (${a}장 중 ${a-left}번째)`:null)}
    case'remove':{if(myth()){deckFixed();return next()}return pickFromDeck('제거할 카드를 고른다',c=>{r.deck.splice(r.deck.indexOf(c),1);save();next()},next)}
    case'rare':{if(myth()){deckFixed();return next()}const opts=shuffle([...POOL.rare]).slice(0,3);const sc=openScreen('',{dim:true});
      sc.innerHTML=`<div class="panel" style="align-items:center"><div class="ptitle">희귀 카드</div><div class="psub">한 장을 덱에 넣는다 — 카드를 누르면 뒤집힌다</div>
        <div class="cardrow">${opts.map(id=>`<div class="cardpick">${staticCard(id,false)}<button class="plate-btn" data-take="${id}">덱에 넣기</button></div>`).join('')}</div><button class="btn-ghost" id="rSkip">넘어간다</button></div>`;
      bindStatic(sc);sc.querySelectorAll('[data-take]').forEach(x=>x.onclick=()=>{addToDeck(x.dataset.take);next()});$('#rSkip').onclick=next;return}
    case'traitSwap':{if(!r.traits||!r.traits.length){notes.push('바뀔 특성이 없다');return next()}const i=Math.floor(rnd()*r.traits.length),old=r.traits[i];
      const pool=Object.keys(PTRAIT).filter(k=>!PTRAIT[k].hide&&!r.traits.includes(k)&&!PT_CONFLICT.some(p=>p.includes(k)&&p.some(q=>q!==k&&r.traits.includes(q)&&q!==old)));
      if(pool.length){const nk=pick(pool);r.traits[i]=nk;if(old==='hpUp'||old==='hpDown'||nk==='hpUp'||nk==='hpDown'){const m0=hpMulOf(r.traits.map(k=>k===nk?old:k)),m1=hpMulOf(r.traits);r.base1=r.base1/m0*m1;r.maxHp=Math.max(1,Math.round(r.maxHp/m0*m1));r.hp=clamp(r.hp,1,r.maxHp)}
        notes.push(`특성 「${PTRAIT[old].n}」 → 「${PTRAIT[nk].n}」`)}return next()}
    case'next':r.next=r.next||{};r.next[a]=(r.next[a]||0)+b;return next();
    case'act':r.flags[a]=(r.flags[a]||0)+b;return next();
    case'fight':{const E=makeEnemy(a);if(b&&b.noFlee)E.noFlee=true;r.at={kind:'combat',enemy:E};save();if(notes.length)toast('사건',notes.join(' · '));return transition(resumeAt)}
  }
  next();
}

  const sc=openScreen('',{dim:true});

    <div class="dres" id="dres" hidden></div><button class="btn-main" id="dGo" hidden>계속</button></div>`;
  const fin=()=>{const dw=$('#dw');if(!dw)return;dw.innerHTML=d36SVG(L.auto?'✓':roll,ok?'ok':'ng');sfx(ok?'block':'hurt',.6);
    const dr=$('#dres');dr.hidden=false;dr.className='dres '+(ok?'ok':'ng');dr.innerHTML=`<b>${L.auto?'판정 없이 통과':ok?'성공':'실패'}</b><span>${res.s}</span>`;
    const go=$('#dGo');go.hidden=false;go.onclick=()=>runFx(res.fx,showMap);go.focus({preventScroll:true})};
  if(L.auto||REDUCED)return fin();
  let n=0;const tick=()=>{const dw=$('#dw');if(!dw)return;if(n++>=16)return fin();dw.innerHTML=d36SVG(ri(L.M,36),'rolling');sfx('miss',.3);setTimeout(tick,40+n*6)};tick();
}

/* 버리기 — 카드 효과로 버린 장수는 이번 턴·이번 전투 동안 셈 */
function tossCards(list){const C=S.C;for(const c of list){const i=C.hand.indexOf(c);if(i<0)continue;C.hand.splice(i,1);C.disc.push(c);C.tossed=(C.tossed||0)+1;C.tossTurn=(C.tossTurn||0)+1}renderCombat()}
function pickToss(max,label){const C=S.C;if(!C.hand.length)return Promise.resolve(0);
  return new Promise(res=>{C.select={type:'toss',max:Math.min(max,C.hand.length),n:0,label,done:res};S.busy=false;renderCombat()}).then(n=>{S.busy=true;return n})}
function finishToss(){const C=S.C,s=C&&C.select;if(!s||s.type!=='toss')return;C.select=null;$('#prompt').hidden=true;clog(`${s.label}: ${s.n}장 버림`);renderCombat();s.done(s.n)}
function doSelect(c){
  const C=S.C;if(!C.select)return;
  if(C.select.type==='copy'){
    const copy={uid:UID++,id:c.id,temp:true,mods:c.mods||[]};
    C.hand.push(copy);
    toast('드라우프니르의 파편',`「${CARDS[c.id].name}」을(를) 복제했다`);
    C.select=null;
  }else if(C.select.type==='toss'){
    tossCards([c]);C.select.n++;if(C.select.n>=C.select.max||!C.hand.length)return finishToss();
  }else if(C.select.type==='discard'){
    C.hand.splice(C.hand.indexOf(c),1);C.disc.push(c);
    if(C.log)clog(`패 초과: 「${CARDS[c.id].name}」 버림`);
    if(C.hand.length<=MAX_HAND)C.select=null;
  }
  $('#prompt').hidden=true;renderCombat();
}
function showSelectPrompt(){
  const C=S.C,p=$('#prompt');
  if(C&&C.select&&C.select.type==='toss'){p.hidden=false;p.innerHTML=`<span>${C.select.label} — 버릴 카드를 패에서 고른다 <b>${C.select.n} / ${C.select.max}</b></span><button class="plate-btn" id="tossDone">다 골랐다</button>`;$('#tossDone').onclick=finishToss}
  else if(C&&C.select&&C.select.type==='discard'){p.hidden=false;p.innerHTML=`<span>패가 ${MAX_HAND}장을 넘었다 — 버릴 카드 <b>${C.hand.length-MAX_HAND}</b>장을 패에서 고른다</span>`}
  else if(C&&C.select){p.hidden=false;p.innerHTML=`복제할 카드를 패에서 고른다 <button class="plate-btn" id="selCancel">취소</button>`;$('#selCancel').onclick=()=>{C.select=null;p.hidden=true;renderCombat()}}
  else p.hidden=true;
}

function fxEl(cls,x,y,vars,life){const el=document.createElement('div');el.className=cls;el.style.left=x+'px';el.style.top=y+'px';

function slashFx(x,y,tier,sc=1){if(REDUCED)return;const n=1;
  for(let i=0;i<n;i++){const a=(i?135:-25)+(rnd()-.5)*30;fxEl('slash',x+(rnd()-.5)*30,y+(rnd()-.5)*30,{'--a':a+'deg','--w':(260+tier*90)*sc+'px','--h':(4+tier*2.5)*sc+'px'},400)}}

  fxEl('spark',x,y,{'--r':r+'deg','--d':(60+rnd()*90*(1+tier*.35))*sc+'px','--l':(8+rnd()*12)*sc+'px','--t':(.32+rnd()*.25)+'s',...(col?{'--c':col}:{})},650)}}

/* 효과음 — 브라우저에서 직접 합성 (파일 없음) */
let AC=null;
function sfx(kind,amt=1){
  if(!SET.sound)return;let a;try{a=AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume()}catch(e){return}
  const t=a.currentTime,out=a.destination,v=Math.min(1.5,amt);
  if(!sfx.nb){const b=a.createBuffer(1,a.sampleRate*.4|0,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;sfx.nb=b}
  const noise=(dur,f,q,vol,type='bandpass')=>{const s=a.createBufferSource();s.buffer=sfx.nb;
    const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(out);s.start(t);s.stop(t+dur+.02)};
  const tone=(f0,f1,dur,vol,type='sine',dl=0)=>{const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t+dl);o.frequency.exponentialRampToValueAtTime(f1,t+dl+dur);
    const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.setValueAtTime(vol,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+dur);o.connect(g).connect(out);o.start(t);o.stop(t+dl+dur+.02)};
  if(kind==='hit'){noise(.09,2600,.9,.35*v);noise(.16,500,.7,.35*v,'lowpass');tone(170,48,.16,.55*v)}
  else if(kind==='big'){noise(.12,2200,.7,.5*v);noise(.35,380,.6,.55*v,'lowpass');tone(120,32,.38,.8*v,'triangle');tone(60,28,.45,.5*v,'sine',.02)}
  else if(kind==='block'){tone(2300,1500,.14,.08,'square');tone(1250,900,.2,.08,'triangle');noise(.07,5200,3,.22)}
  else if(kind==='miss'){noise(.2,1200,1.4,.18,'bandpass')}
  else if(kind==='hurt'){tone(95,38,.28,.7*v,'triangle');noise(.18,700,.7,.4*v,'lowpass')}
  else if(kind==='gore'){/* 파육음: 젖은 살이 찢기는 소리 — 짧은 잡음 덩어리를 겹치고 낮게 꺼지는 울림 */
    const at=(dl,dur,f,q,vol,type)=>{const s2=a.createBufferSource();s2.buffer=sfx.nb;s2.playbackRate.value=.55+rnd()*.5;const fl=a.createBiquadFilter();fl.type=type||'bandpass';
      fl.frequency.setValueAtTime(f,t+dl);fl.frequency.exponentialRampToValueAtTime(Math.max(60,f*.35),t+dl+dur);fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(.0001,t+dl);g.gain.linearRampToValueAtTime(vol,t+dl+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dl+dur);s2.connect(fl).connect(g).connect(out);s2.start(t+dl);s2.stop(t+dl+dur+.05)};
    [0,.09,.15,.27,.36,.52,.6].forEach((dl,i)=>at(dl,.16+rnd()*.14,900+rnd()*1400,2+rnd()*3,.55-.04*i));
    at(.05,.7,420,.8,.6,'lowpass');at(.4,.9,260,.7,.5,'lowpass');
    tone(70,26,.9,.9,'sine',.02);tone(140,40,.35,.35,'triangle',.3)}
}
/* 적에게 준 피해 연출 — 피해량에 따라 3단계 */
function impactEnemy(loss,bl){
  const C=S.C,E=C&&C.E;if(!E)return 0;const o=L[S.orient],x=o.ex,y=o.efeet-o.eh*.55;
  if(loss<=0){if(bl){sparks(x,y,7,'#cfe6ff');sfx('block')}return 0}
  const fr=loss/Math.max(1,E.maxHp),tier=(fr>=.12||loss>=60)?3:(fr>=.05||loss>=25)?2:1;
  slashFx(x,y,tier);sparks(x,y,3+tier*2,null,tier);if(tier>=3)ringFx(x,y,tier);
  sfx(tier>=3?'big':'hit',.8+tier*.25);if(tier>=3)shake(.9);
  return tier;
}

function modChoices(c){
  const d=CARDS[c.id];if(d.type==='curse'||d.rar==='special')return[];
  return Object.keys(MODS).filter(k=>{const m=MODS[k];if(hasM(c,k))return false;if(k==='light'&&!(d.cost>0))return false;
    return m.f==='all'||(m.f==='atk'&&d.type==='atk')||(m.f==='def'&&d.type==='def')});
}
function showUpgrade(done=showMap,back=showRest,title){
  const r=S.run,ok=r.deck.filter(c=>modChoices(c).length&&(c.mods||[]).length<2);
  pickFromDeck(title||'강화할 카드를 고른다',c=>{
    const nOpt=eq('w_stein')?4:3,opts=shuffle(modChoices(c)).slice(0,nOpt);
    eventPanel('강화',`「${cardName(c.id,c)}」에 새길 특수능력`,(nOpt===4?'네':'세')+' 가지 중 하나를 고른다. 카드 한 장에는 특수능력을 두 개까지 새길 수 있다.',
      opts.map(k=>({b:MODS[k].n,s:MODS[k].t,f:()=>{c.mods=[...(c.mods||[]),k];done()}})));
  },back,ok);
}

    const ch=hitChance(u.t==='last'&&H.god==='odin'?1069:u.acc+HC.buffAcc-(u.mabi?10:0),H.P.eva-HC.evaMinus);
    return['atk',`${ICON.atk}${lo===hi?lo:`${lo}~${hi}`}${it.hits>1?`×${it.hits}`:''}<em>${ch}%</em>${nm}`]}
  if(it.k==='def'&&it.die)return['def',`${ICON.def}${it.die.a}~${it.die.b}${nm}`];
  return[it.k,u.hero?it.n:`<em>${it.n}</em>`]}
function hRenderUnits(){
  const HC=S.C,root=$('#hunt');
  HC.units.forEach((u,i)=>{if(!u||u.dead)return;let el=hEls.get(u.id);const r=slotRect(i,u);
    if(!el){const off=SLOT[S.orient].offs[i]||0;el=document.createElement('div');el.className='unit enter'+(off<=-2?' from-l':off>=2?' from-r':'')+(u.hero?' hero':'');el.innerHTML=`<div class="uint"></div><div class="uart">${uSVG(u.t)}</div><div class="uplate"></div>`;
      root.appendChild(el);hEls.set(u.id,el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('enter')));
      el.addEventListener('click',()=>{if(!drag)hUnitInfo(u.id)})}
    Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px',zIndex:r.z});
    el.classList.toggle('stop',!!u.stopped);
    const[ic,ih]=uIntentHTML(u);const ie=el.querySelector('.uint');ie.className='uint '+ic;ie.innerHTML=ih;ie.hidden=HC.phase!=='player'&&!u.intent;
    const ch=[];if(u.block)ch.push(`<span class="uc bl">방어 ${u.block}</span>`);if(u.el)ch.push(`<span class="uc el">전격 ${u.el}</span>`);if(u.burn)ch.push(`<span class="uc bu">소각 ${u.burn}</span>`);
    if(u.mark)ch.push(`<span class="uc mk">명중 ${u.mark}</span>`);if(u.mabi)ch.push(`<span class="uc pa">마비</span>`);if(u.tech)ch.push(`<span class="uc bl">기술 +${u.tech}</span>`);
    if(u.evaB)ch.push(`<span class="uc bl">회피 +${u.evaB}</span>`);if(u.guard)ch.push('<span class="uc bl">막아섬</span>');if(u.giant)ch.push('<span class="uc">거인 후보</span>');if(u.noble)ch.push('<span class="uc mk">숭고함</span>');if(u.burnt)ch.push('<span class="uc bu">번제화</span>');if(u.t==='last'&&HC.lastPassive)ch.push(`<span class="uc mk">${HC.lastPassive}</span>`);
    el.querySelector('.uplate').innerHTML=`<div class="un">${u.n}</div><div class="ubar"><i style="width:${clamp(u.hp/u.maxHp*100,0,100)}%"></i><span>${Math.max(0,u.hp)}</span></div><div class="uchips">${ch.join('')}</div>`;
  });
  const rv=$('#reserve');rv.hidden=!HC.reserve.length;rv.innerHTML=`뒤에 <b>${HC.reserve.length}</b>명`;
}
function hRenderPlayer(){
  const H=S.H,HC=S.C,P=H.P,G=GODS[H.god],dain=H.god==='dain';
  const chips=[];
  if(H.yu)chips.push(`<span class="chip good">유희 ${H.yu} · 피해 +${H.yu*20}%</span>`);
  if(H.god==='surt'){chips.push(`<span class="chip brass">명멸의 불꽃 ${H.flicker}</span>`);chips.push(`<span class="chip">소각 ${H.selfBurn} / 100</span>`)}
  if(H.mimic)chips.push(`<span class="chip brass">모방 · ${MIMIC_OPTS[H.mimic].n}</span>`);
  if(HC.thrown)chips.push('<span class="chip">묠니르 던짐</span>');
  if(HC.evaMinus)chips.push(`<span class="chip bad">회피 -${HC.evaMinus}</span>`);
  if(HC.cocoonSkip)chips.push('<span class="chip">고치 · 다음 턴 건너뜀</span>');
  if(HC.atkPlus)chips.push(`<span class="chip good">공격레벨 +${HC.atkPlus}</span>`);
  if(dain){chips.push(`<span class="chip brass">섭취 ${HC.eat}</span>`);if(P.hp<=P.maxHp*.25)chips.push('<span class="chip bad">광전사-강화</span>')}
  if(HC.pEl)chips.push(`<span class="chip bad">전격 ${HC.pEl}</span>`);if(HC.pBurn)chips.push(`<span class="chip bad">소각 ${HC.pBurn}</span>`);
  if(HC.iceMinus)chips.push('<span class="chip bad">다음 턴 코스트 -1</span>');
  if(HC.pVuln)chips.push(`<span class="chip bad">취약 ${HC.pVuln}</span>`);
  const pct=clamp(P.hp/P.maxHp*100,0,100);
  $('#ppanel').innerHTML=`<div class="pp-name">${G.god} · ${G.weapon}<small>Lv ${P.lvl} · 공 ${P.atk+HC.atkPlus} · 방 ${P.def}</small></div>
    <div class="pp-hp"><div class="pbar"><i style="width:${pct}%"></i><span>${Math.max(0,P.hp).toLocaleString()} / ${P.maxHp.toLocaleString()}</span></div></div>
    <div class="pp-row">${dain?'<div class="orb blood" title="코스트 대신 체력을 소모해 카드를 사용함">포식</div>':`<div class="orb" title="코스트">${HC.energy}<small>/${HC.maxE}</small></div>`}
      <div class="shield${HC.block?'':' zero'}"><b>${HC.block}</b>방어도</div></div>
    ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}`;
  pilesHTML(HC,HC.phase==='enemy'?'인간의 차례':'턴 종료',HC.phase!=='player'||HC.over||!!HC.select,()=>hEndTurn());
}
function hRender(){if(S.screen!=='hunt'||!S.C)return;settleHand();hRenderUnits();hRenderPlayer();renderHand();renderTop();showSelectPrompt();const HC=S.C,P=S.H.P;if(S.H.god==='dain'&&!HC.over&&!HC.dead&&P.hp>0&&dainDying(P.hp,P.maxHp))hGameOver()}
function hUnitInfo(id){
  const HC=S.C,u=hAlive().find(x=>x.id===id);if(!u)return;const H=S.H,P=H.P,hd=HERO[u.t];
  const m=$('#modal');m.hidden=false;

    <div style="display:flex;gap:34px;flex-wrap:wrap"><div class="stattable"><span>레벨</span><span>${u.lv}</span><span>체력</span><span>${Math.max(0,u.hp)} / ${u.maxHp}</span><span>공격레벨</span><span>${u.atk}</span><span>방어레벨</span><span>${u.def}</span><span>명중률</span><span>${u.acc}%</span><span>회피</span><span>${u.eva}%</span>
      <span>내 적중률</span><span>${hitChance(hasTitle('pil')?1069:P.acc,u.eva+u.evaB)}%</span><span>상대 적중률</span><span>${hitChance(u.acc+HC.buffAcc,P.eva-HC.evaMinus)}%</span></div>
    <div class="plist" style="flex:1;min-width:0">${hd?hd.passives.map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join('')+`<div><b>행동</b>${[...new Set(hd.acts)].map(n=>{const a=HACT[n];return`${n}${a.d&&a.d.t?` (${DIE_NAME[a.d.t]} ${a.d.a}~${a.d.b}${a.hits>1?` ×${a.hits}`:''})`:''}${a.tmp?' *임시':''}`}).join(' · ')}${u.t==='nameless'?' · 거인을 향한 일격 (공격 56~84)':''}${u.t==='last'?' · 마침표 (체력 25% 이하, 공격 96~144)':''}</div>`:`<div><b>무장</b>${({villager:'낫',spear:'창',archer:'활',shield:'방패',zealot:'단검 두 자루',einherjar:'은빛 갑주'})[u.t]}</div><div class="hint" style="text-align:left">일반 인간의 수치는 임시입니다.</div>`}</div></div></div>`;
  $('#mClose').onclick=closeModal;
}
function fxXY(x,y,txt,cls){const el=document.createElement('div');el.className='fnum '+(cls||'');el.textContent=txt;el.style.left=x+'px';el.style.top=y+'px';$('#fx').appendChild(el);setTimeout(()=>el.remove(),1150)}
function fxU(u,txt,cls){const HC=S.C;const i=HC.units.indexOf(u);if(i<0)return;const r=slotRect(i,u);fxXY(r.cx+(rnd()-.5)*40,r.cy+(rnd()-.5)*40,txt,(cls||'')+' sm')}
function fxP(txt,cls){if(S.orient==='land')fxXY(170+(rnd()-.5)*60,630+(rnd()-.5)*20,txt,cls);else fxXY(450+(rnd()-.5)*160,790,txt,cls)}

/* ================= boot ================= */
function boot(data){
  if(data&&data.v===3&&data.S&&(data.S.run||data.S.H)){Object.assign(S,data.S,{busy:false});if(S.run)migrateRun(S.run);syncUID();
    if(S.C&&S.C.phase==='enemy')S.C.phase='player';}
  addEventListener('resize',fit);
  document.addEventListener('gesturestart',e=>e.preventDefault());
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  const o0=S.orient;S.orient='';fit();if(!S.orient)S.orient=o0;
  if(!REDUCED)requestAnimationFrame(loop);
  if(S.H&&S.screen.startsWith('hunt')&&S.screen!=='huntOver')resumeHunt();
  else if(S.run&&['combat','map','reward','rest','shop','event'].includes(S.screen))resumeAt();
  else if(S.screen==='climbPrep')showClimbPrep();
  else if(S.screen==='annihPrep')showAnnihPrep();
  else showTitle({menu:!!S.titleMenu});
}
try{window.claude?.hot?.snapshot?.(()=>({v:3,S:JSON.parse(JSON.stringify({...S,busy:false}))}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
